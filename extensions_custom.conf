; Append this to /etc/asterisk/extensions_custom.conf, then: asterisk -rx "dialplan reload"

; ============ 1) Missed-call callback routing (inbound) ============
; A caller we rang without an answer (see lastcaller.sh) hears custom/callback-prompt.
; 1 = connect to the extension that called them; anything else / 5s timeout = normal inbound route.
; Activate by adding  context=from-trunk-callback  to the trunk's PEER Details.
[from-trunk-callback]
; If the trunk has a channel limit, keep Issabel's counter: copy the OUT_n value from
; [from-trunk-sip-YOURTRUNK] in extensions_additional.conf.
exten => _[+0-9s]!,1,Set(GROUP()=OUT_1)
 same => n,Set(CBNUM=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(CBEXT=${FILTER(0-9,${SHELL(/usr/local/bin/lastcaller.sh ${CBNUM})})})
 same => n,GotoIf($["${CBEXT}" = ""]?normal)
 same => n,Answer()
 same => n,Read(CBKEY,custom/callback-prompt,1,,1,5)
 same => n,GotoIf($["${CBKEY}" != "1"]?normal)
 same => n,Dial(Local/${CBEXT}@from-did-direct/n,20,tr)
 same => n(normal),Goto(from-trunk,${EXTEN},1)


; ============ 2) Camp-on: ring me back when a busy extension is free ============
; One hook line per extension. Numbers not listed here behave exactly as stock.
; shortcut: static list, add a line when a new extension is created.
[from-internal-custom]
exten => 101,1,Goto(campon,${EXTEN},1)
exten => 102,1,Goto(campon,${EXTEN},1)
exten => 103,1,Goto(campon,${EXTEN},1)

[campon]
; Only for a phone dialing directly (not ring groups/queues/trunk transfers).
; Dormant until /var/lib/asterisk/sounds/custom/campon-prompt.wav exists.
exten => _X.,1,Set(CPSRC=${CHANNEL(peername)})
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "SIP"]?pass)
 same => n,GotoIf($[${DB_EXISTS(AMPUSER/${CPSRC}/device)} = 0]?pass)
 same => n,GotoIf($["${CPSRC}" = "${EXTEN}"]?pass)
 same => n,GotoIf($[${STAT(e,/var/lib/asterisk/sounds/custom/campon-prompt.wav)} = 0]?pass)
 same => n,Set(CPST=${DEVICE_STATE(SIP/${EXTEN})})
 same => n,GotoIf($["${CPST}" = "NOT_INUSE" | "${CPST}" = "UNAVAILABLE" | "${CPST}" = "UNKNOWN" | "${CPST}" = "INVALID"]?pass)
 same => n,Answer()
 same => n,Read(CPKEY,custom/campon-prompt,1,,1,5)
 same => n,GotoIf($["${CPKEY}" != "1"]?pass)
 same => n,Originate(Local/${CPSRC}*${EXTEN}@campon-wait/n,exten,campon-go,${CPSRC}*${EXTEN},1,1900,a)
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(pass),Goto(from-did-direct,${EXTEN},1)

[campon-wait]
; EXTEN = caller*target. Poll every 3s (max 30 min) until both are idle, then ring the caller.
exten => _X.,1,Set(CPSRC=${CUT(EXTEN,*,1)})
 same => n,Set(CPDST=${CUT(EXTEN,*,2)})
 same => n,Set(CPN=0)
 same => n(loop),Wait(3)
 same => n,Set(CPN=$[${CPN} + 1])
 same => n,GotoIf($[${CPN} > 600]?done)
 same => n,GotoIf($["${DEVICE_STATE(SIP/${CPDST})}" != "NOT_INUSE" | "${DEVICE_STATE(SIP/${CPSRC})}" != "NOT_INUSE"]?loop)
 same => n,Set(CALLERID(all)="Free ${CPDST}" <${CPDST}>)
 same => n,Dial(SIP/${CPSRC},25)
 same => n(done),Hangup()

[campon-go]
; Caller picked up: place the call to the target as if the caller dialed it.
exten => _X.,1,Set(CALLERID(num)=${CUT(EXTEN,*,1)})
 same => n,Goto(from-internal,${CUT(EXTEN,*,2)},1)
