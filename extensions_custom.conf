; Append this to /etc/asterisk/extensions_custom.conf, then: asterisk -rx "dialplan reload"

; Missed-call callback routing (inbound)
; A caller we rang without an answer (see lastcaller.sh) hears custom/callback-prompt.
; 1 = connect to the extension that called them; anything else / 5s timeout = normal inbound route.
; Activate by adding  context=from-trunk-callback  to the trunk's PEER Details.
[from-trunk-callback]
; If the trunk has a channel limit, keep Issabel's counter: copy the OUT_n value from
; [from-trunk-sip-YOURTRUNK] in extensions_additional.conf.
exten => _[+0-9s]!,1,Set(GROUP()=OUT_1)
 same => n,Set(CBNUM=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(CBEXT=${FILTER(0-9,${SHELL(/usr/local/bin/lastcaller.sh ${CBNUM})})})
 same => n,GotoIf($["${CBEXT}" = ""]?normal)
 same => n,Answer()
 same => n,Read(CBKEY,custom/callback-prompt,1,,1,5)
 same => n,GotoIf($["${CBKEY}" != "1"]?normal)
 same => n,Dial(Local/${CBEXT}@from-did-direct/n,20,tr)
 same => n(normal),Goto(from-trunk,${EXTEN},1)
